# 每次推送都跑：单元测试、发版检查（版本号 / 更新日志 / 手册是否最新）、真的装一遍再卸掉。
name: CI
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python tools/check_release.py

  install-scripts:
    # 真的跑一遍安装脚本和卸载脚本（Windows 用 PowerShell 5.1，也就是用户电脑上默认那个）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装、跑、卸（Mac / Linux）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp -r "$GITHUB_WORKSPACE" ~/.skillpm-src
          ~/.skillpm-src/scripts/install.sh --launcher
          export PATH="$HOME/.local/bin:$PATH"
          skillpm --version
          skillpm host list
          ~/.skillpm-src/scripts/uninstall.sh
          ! command -v skillpm
      - name: 装、跑、卸（Windows PowerShell 5.1）
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Copy-Item -Recurse $env:GITHUB_WORKSPACE "$env:USERPROFILE\.skillpm-src"
          & "$env:USERPROFILE\.skillpm-src\scripts\install.ps1" -Yes
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          skillpm --version
          skillpm host list
          & "$env:USERPROFILE\.skillpm-src\scripts\uninstall.ps1"
